<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gràfic de dispersió: Messi vs. Cristiano Ronaldo per estat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --messi: #0E97B7;
      --messi-soft: #E1F3F7;
      --cristiano: #CE2B37;
      --cristiano-soft: #FBE6E8;
      --neutral: #8B95A1;
      --neutral-soft: #EEF1F4;
      --dark: #252552;
      --surface: #FFFFFF;
      --ink: #1A1C1F;
      --ink-soft: #50575E;
      --line: #E4E2DC;
      --font-head: 'Archivo', system-ui, sans-serif;
      --font-body: 'Source Serif 4', Georgia, serif;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 1.18rem;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }

    .bc__note {
      font-family: var(--font-head);
      font-size: 0.82rem;
      color: var(--ink-soft);
      line-height: 1.4;
      margin: 1rem 0 0;
    }

    /* Tooltip */
    .chart-tip {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      background: var(--dark);
      color: #fff;
      font-family: var(--font-head);
      font-size: 0.85rem;
      line-height: 1.35;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      opacity: 0;
      transition: opacity 0.12s;
      max-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chart-tip--show { opacity: 1; }
    .chart-tip strong { font-size: 0.95rem; margin-bottom: 2px; }
    .chart-tip__row   { display: flex; align-items: center; gap: 6px; }
    .chart-tip__dot   { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .chart-tip__dot--messi { background: var(--messi); }
    .chart-tip__dot--cr7   { background: var(--cristiano); }
    .chart-tip__diff  { margin-top: 3px; opacity: 0.85; font-size: 0.8rem; }

    /* Dispersió */
    .sc__wrap { display: flex; gap: 0.5rem; }
    .sc__yaxis {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--cristiano);
      text-align: center;
      flex: 0 0 auto;
    }
    .sc__plot {
      position: relative;
      flex: 1 1 auto;
      aspect-ratio: 1 / 1;
      border-left: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      background: linear-gradient(to top left,
        var(--messi-soft) 0 49.4%,
        var(--line) 49.4% 50.6%,
        var(--cristiano-soft) 50.6% 100%);
      overflow: visible;
    }
    .sc__grid { position: absolute; background: rgba(0,0,0,0.07); }
    .sc__grid--v { top: 0; bottom: 0; width: 1px; }
    .sc__grid--h { left: 0; right: 0; height: 1px; }
    .sc__tick {
      position: absolute;
      font-family: var(--font-head);
      font-size: 0.7rem;
      color: var(--ink-soft);
    }
    .sc__tick--x { bottom: -20px; transform: translateX(-50%); }
    .sc__tick--y { left: -16px; transform: translateY(-50%); }
    .sc__zone {
      position: absolute;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 0.86rem;
      line-height: 1.3;
      max-width: 44%;
      pointer-events: none;
    }
    .sc__zone--cr7   { top: 2.5%; left: 2.5%; color: var(--cristiano); text-align: left; }
    .sc__zone--messi { bottom: 2.5%; right: 2.5%; color: var(--messi); text-align: right; }
    .sc__pt {
      position: absolute;
      width: 26px; height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      border: 2px solid #fff;
      background-size: cover;
      background-position: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      cursor: pointer;
      padding: 0;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .sc__pt:hover, .sc__pt:focus-visible {
      transform: scale(1.35);
      z-index: 5;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
      outline: none;
    }
    .sc__pt--messi { outline: 2px solid var(--messi); }
    .sc__pt--cr7   { outline: 2px solid var(--cristiano); }
    .sc__pt--cap   { outline: 2px solid var(--neutral); }
    .sc__xaxis {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--messi);
      text-align: center;
      margin-top: 0.5rem;
      padding-left: 1.5rem;
    }

    @media (max-width: 640px) {
      .sc__pt { width: 20px; height: 20px; margin: -10px 0 0 -10px; }
    }
  </style>
</head>
<body>
  <div id="chart-scatter"></div>

  <script>
  (function () {
    'use strict';

    var BASE = 'https://messi-cristiano-ronaldo-politica.periodismededades.cat/assets/';

    var C = [
      { code: 'kr', name: 'Corea del Sud',  cr7: 3.54, messi: 4.91, rpp: -1.37, lean: 'messi' },
      { code: 'ar', name: 'Argentina',       cr7: 4.91, messi: 6.23, rpp: -1.32, lean: 'messi' },
      { code: 'fi', name: 'Finlàndia',       cr7: 4.62, messi: 4.96, rpp: -0.34, lean: 'messi' },
      { code: 'es', name: 'Espanya',         cr7: 4.34, messi: 4.68, rpp: -0.33, lean: 'messi' },
      { code: 'gb', name: 'Regne Unit',      cr7: 4.75, messi: 5.05, rpp: -0.31, lean: 'messi' },
      { code: 'no', name: 'Noruega',         cr7: 4.75, messi: 4.95, rpp: -0.20, lean: 'messi' },
      { code: 'us', name: 'Estats Units',    cr7: 4.49, messi: 4.67, rpp: -0.19, lean: 'messi' },
      { code: 'ca', name: 'Canadà',          cr7: 4.91, messi: 5.05, rpp: -0.14, lean: 'messi' },
      { code: 'za', name: 'Sud-àfrica',      cr7: 5.78, messi: 5.88, rpp: -0.10, lean: 'cap'   },
      { code: 'jp', name: 'Japó',            cr7: 4.80, messi: 4.84, rpp: -0.05, lean: 'cap'   },
      { code: 'ph', name: 'Filipines',       cr7: 4.93, messi: 4.92, rpp:  0.01, lean: 'cap'   },
      { code: 'br', name: 'Brasil',          cr7: 5.82, messi: 5.80, rpp:  0.02, lean: 'cap'   },
      { code: 'au', name: 'Austràlia',       cr7: 4.94, messi: 4.91, rpp:  0.03, lean: 'cap'   },
      { code: 'de', name: 'Alemanya',        cr7: 4.79, messi: 4.76, rpp:  0.03, lean: 'cap'   },
      { code: 'nl', name: 'Països Baixos',   cr7: 4.58, messi: 4.54, rpp:  0.04, lean: 'cap'   },
      { code: 'ng', name: 'Nigèria',         cr7: 6.14, messi: 6.01, rpp:  0.13, lean: 'cr7'   },
      { code: 'in', name: 'Índia',           cr7: 6.08, messi: 5.93, rpp:  0.14, lean: 'cr7'   },
      { code: 'fr', name: 'França',          cr7: 4.74, messi: 4.59, rpp:  0.15, lean: 'cr7'   },
      { code: 'cn', name: 'Xina',            cr7: 5.09, messi: 4.92, rpp:  0.16, lean: 'cr7'   },
      { code: 'sg', name: 'Singapur',        cr7: 4.92, messi: 4.74, rpp:  0.18, lean: 'cr7'   },
      { code: 'pt', name: 'Portugal',        cr7: 5.03, messi: 4.66, rpp:  0.37, lean: 'cr7'   },
      { code: 'my', name: 'Malàisia',        cr7: 5.35, messi: 4.96, rpp:  0.39, lean: 'cr7'   },
      { code: 'eg', name: 'Egipte',          cr7: 5.33, messi: 4.92, rpp:  0.41, lean: 'cr7'   },
      { code: 'mx', name: 'Mèxic',           cr7: 5.52, messi: 5.11, rpp:  0.41, lean: 'cr7'   },
      { code: 'tr', name: 'Turquia',         cr7: 5.57, messi: 5.11, rpp:  0.46, lean: 'cr7'   },
      { code: 'id', name: 'Indonèsia',       cr7: 5.88, messi: 5.37, rpp:  0.50, lean: 'cr7'   }
    ];

    function fmt2(v) { return v.toFixed(2).replace('.', ','); }

    var tip;
    function ensureTip() {
      if (tip) return tip;
      tip = document.createElement('div');
      tip.className = 'chart-tip';
      document.body.appendChild(tip);
      return tip;
    }
    function showTip(html, x, y) {
      var t = ensureTip();
      t.innerHTML = html;
      t.classList.add('chart-tip--show');
      var w = t.offsetWidth, h = t.offsetHeight;
      var left = x - w / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
      var top = y - h - 14;
      if (top < 8) top = y + 18;
      t.style.left = left + 'px';
      t.style.top  = top  + 'px';
    }
    function hideTip() { if (tip) tip.classList.remove('chart-tip--show'); }

    function tipHTML(c) {
      var dir  = c.rpp < 0 ? 'Messi' : 'Cristiano Ronaldo';
      var diff = '+' + Math.abs(c.rpp).toFixed(2).replace('.', ',') + ' a favor de ' + dir;
      if (c.lean === 'cap') diff += ' (no significatiu)';
      return '<strong>' + c.name + '</strong>' +
        '<span class="chart-tip__row"><span class="chart-tip__dot chart-tip__dot--messi"></span>Messi: ' + fmt2(c.messi) + '</span>' +
        '<span class="chart-tip__row"><span class="chart-tip__dot chart-tip__dot--cr7"></span>Cristiano Ronaldo: ' + fmt2(c.cr7) + '</span>' +
        '<span class="chart-tip__diff">' + diff + '</span>';
    }

    function scatter() {
      var root = document.getElementById('chart-scatter');
      if (!root) return;

      var MIN = 3.4, MAX = 6.4, RANGE = MAX - MIN;
      function xPct(v) { return (v - MIN) / RANGE * 100; }
      function yPct(v) { return (1 - (v - MIN) / RANGE) * 100; }

      var ticks = [4, 5, 6];
      var html  = '';
      html += '<div class="sc__wrap">';
      html += '<div class="sc__yaxis">Valoració de Cristiano Ronaldo ▼</div>';
      html += '<div class="sc__plot">';

      ticks.forEach(function (t) {
        html += '<span class="sc__grid sc__grid--v" style="left:' + xPct(t) + '%"></span>';
        html += '<span class="sc__grid sc__grid--h" style="top:'  + yPct(t) + '%"></span>';
        html += '<span class="sc__tick sc__tick--x" style="left:' + xPct(t) + '%">' + t + '</span>';
        html += '<span class="sc__tick sc__tick--y" style="top:'  + yPct(t) + '%">' + t + '</span>';
      });

      html += '<span class="sc__zone sc__zone--cr7">Els estats per sobre de la diagonal s\'inclinen cap a Cristiano Ronaldo</span>';
      html += '<span class="sc__zone sc__zone--messi">Els punts per sota de la diagonal s\'inclinen cap a Leo Messi</span>';

      C.forEach(function (c) {
        html += '<button type="button" class="sc__pt sc__pt--' + c.lean + '" data-code="' + c.code + '" ' +
          'style="left:' + xPct(c.messi) + '%;top:' + yPct(c.cr7) + '%;background-image:url(' + BASE + 'flags/' + c.code + '.svg)" ' +
          'aria-label="' + c.name + '"></button>';
      });

      html += '</div>';
      html += '</div>';
      html += '<div class="sc__xaxis">Valoració de Messi ▶</div>';

      root.innerHTML = html;

      var byCode = {};
      C.forEach(function (c) { byCode[c.code] = c; });
      var pts = root.querySelectorAll('.sc__pt');
      Array.prototype.forEach.call(pts, function (pt) {
        var c = byCode[pt.getAttribute('data-code')];
        function show() { var r = pt.getBoundingClientRect(); showTip(tipHTML(c), r.left + r.width / 2, r.top); }
        pt.addEventListener('pointerenter', show);
        pt.addEventListener('pointerleave', hideTip);
        pt.addEventListener('focus',        show);
        pt.addEventListener('blur',         hideTip);
      });
      root.addEventListener('pointerleave', hideTip);
    }

    scatter();
  })();
  </script>
  <script>
    function sendHeight() {
      window.parent.postMessage({ height: document.documentElement.scrollHeight }, '*');
    }
    window.addEventListener('load', sendHeight);
    new MutationObserver(sendHeight).observe(document.body, { subtree: true, childList: true });
  </script>
</body>
</html>
